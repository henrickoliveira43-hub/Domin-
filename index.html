<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dominó Clube Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --baize-dark: #061c15;
            --baize: #0d3327;
            --baize-light: #124a37;
            --wood-dark: #241209;
            --wood: #3d2314;
            --wood-light: #5c3a20;
            --brass: #cda45e;
            --brass-bright: #e8c877;
            --brass-dim: #8f7038;
            --ivory: #f6efdc;
            --ivory-dim: #e7dcc0;
            --ink: #2a2118;
            --cream: #f3ead2;
            --cream-dim: #b9c9bc;
            --danger: #c0392b;
            --win: #2e8b57;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background:
                radial-gradient(ellipse at 50% 0%, #1a2e22 0%, transparent 55%),
                linear-gradient(160deg, #05100b, #0a1a12 45%, #05100b 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, sans-serif;
            padding: clamp(8px, 2vw, 22px);
            overflow: hidden;
            color: var(--cream);
        }

        .game-container {
            max-width: 1040px;
            width: 100%;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.1)),
                linear-gradient(145deg, var(--wood-light), var(--wood) 55%, var(--wood-dark));
            border-radius: clamp(18px, 3.5vw, 30px);
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.65),
                inset 0 0 0 1px rgba(205, 164, 94, 0.35),
                inset 0 2px 2px rgba(255, 255, 255, 0.08);
            padding: clamp(12px, 2.6vw, 22px);
            border: 1px solid #1b0d05;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        :fullscreen .game-container, :-webkit-full-screen .game-container {
            max-width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px 12px;
            border-bottom: 1px solid rgba(205, 164, 94, 0.25);
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .brand .crest {
            font-size: clamp(1.1rem, 2.6vw, 1.4rem);
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(1.15rem, 3.2vw, 1.65rem);
            letter-spacing: 0.3px;
            background: linear-gradient(180deg, var(--brass-bright), var(--brass) 65%, var(--brass-dim));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        .title .sub {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(0.55rem, 1.6vw, 0.68rem);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--cream-dim);
            display: block;
            margin-top: 2px;
        }

        .actions-header {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: clamp(7px, 1.4vw, 10px) clamp(11px, 1.8vw, 16px);
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.72rem, 1.6vw, 0.85rem);
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn:active { transform: translateY(1px) scale(0.98); }
        .btn:hover { filter: brightness(1.08); }

        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--cream);
            border: 1px solid rgba(205, 164, 94, 0.4);
        }

        .btn-brass {
            background: linear-gradient(180deg, var(--brass-bright), var(--brass-dim));
            color: #241205;
            box-shadow: 0 3px 0 #6b501f, 0 6px 10px rgba(0,0,0,0.4);
        }
        .btn-brass:active { box-shadow: 0 1px 0 #6b501f, 0 2px 4px rgba(0,0,0,0.4); }

        .btn-pass {
            background: rgba(255,255,255,0.05);
            color: var(--cream-dim);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-pass.active {
            background: linear-gradient(180deg, #e0574a, var(--danger));
            color: #fff;
            opacity: 1;
            cursor: pointer;
            box-shadow: 0 3px 0 #7a1e14, 0 0 0 0 rgba(192, 57, 43, 0.6);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 3px 0 #7a1e14, 0 0 0 0 rgba(192, 57, 43, 0.55); }
            70% { box-shadow: 0 3px 0 #7a1e14, 0 0 0 9px rgba(192, 57, 43, 0); }
            100% { box-shadow: 0 3px 0 #7a1e14, 0 0 0 0 rgba(192, 57, 43, 0); }
        }

        .icon-btn {
            width: clamp(32px, 6vw, 38px);
            height: clamp(32px, 6vw, 38px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            padding: 0;
        }

        /* ===== Scoreboard plaque ===== */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.2));
            border-radius: 12px;
            border: 1px solid rgba(205, 164, 94, 0.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -8px 16px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .player-plaque {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px clamp(10px, 2.4vw, 18px);
            position: relative;
            transition: background 0.3s ease;
        }
        .player-plaque + .player-plaque {
            border-left: 1px solid rgba(205, 164, 94, 0.25);
        }
        .player-plaque.turn-active {
            background: radial-gradient(ellipse at center, rgba(205, 164, 94, 0.16), transparent 70%);
        }
        .player-plaque.turn-active .avatar {
            box-shadow: 0 0 0 2px var(--brass-bright), 0 0 14px rgba(232, 200, 119, 0.6);
        }

        .avatar {
            width: clamp(28px, 6vw, 38px);
            height: clamp(28px, 6vw, 38px);
            border-radius: 50%;
            background: linear-gradient(160deg, #1b3a2c, #0a1a12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 2.2vw, 1.2rem);
            border: 2px solid rgba(205, 164, 94, 0.35);
            flex-shrink: 0;
            transition: box-shadow 0.3s ease;
        }

        .plaque-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .plaque-name {
            font-size: clamp(0.72rem, 1.7vw, 0.86rem);
            font-weight: 700;
            color: var(--cream);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .plaque-tiles {
            font-size: clamp(0.62rem, 1.4vw, 0.72rem);
            color: var(--cream-dim);
        }

        .plaque-score {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: var(--brass-bright);
            margin-left: auto;
            text-align: right;
            line-height: 1;
        }
        .plaque-score small {
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cream-dim);
            margin-top: 2px;
        }

        /* ===== Table ===== */
        .table {
            background:
                radial-gradient(ellipse at 50% 30%, var(--baize-light), var(--baize) 55%, var(--baize-dark) 100%);
            border-radius: clamp(14px, 3vw, 22px);
            padding: clamp(10px, 3vw, 20px);
            min-height: 190px;
            box-shadow: inset 0 12px 34px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(0,0,0,0.4);
            border: 6px solid var(--wood-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-grow: 1;
            overflow: hidden;
        }
        .table::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 5px);
            pointer-events: none;
        }

        .table-message {
            color: var(--cream);
            font-weight: 600;
            font-size: clamp(0.78rem, 1.9vw, 0.95rem);
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(205, 164, 94, 0.25);
            padding: 5px 16px;
            border-radius: 20px;
            text-align: center;
            z-index: 1;
        }

        .pool-counter {
            position: absolute;
            bottom: 10px;
            right: 14px;
            font-size: 0.72rem;
            color: var(--cream-dim);
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(205, 164, 94, 0.2);
            padding: 3px 11px;
            border-radius: 10px;
            z-index: 1;
        }

        .domino-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: center;
            gap: clamp(3px, 1vw, 7px);
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px clamp(4px, 3vw, 20px);
            z-index: 1;
            scroll-behavior: smooth;
        }
        .domino-row.is-empty { justify-content: center; }
        .domino-row::-webkit-scrollbar { height: 6px; }
        .domino-row::-webkit-scrollbar-thumb { background: rgba(205, 164, 94, 0.4); border-radius: 4px; }
        .domino-row::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

        .empty-table-hint {
            color: rgba(246, 239, 220, 0.35);
            font-style: italic;
            font-size: 0.85rem;
            font-family: 'Playfair Display', serif;
        }

        /* ===== Domino tile ===== */
        .domino {
            --s: clamp(30px, 6.4vw, 50px);
            width: calc(var(--s) * 2);
            height: var(--s);
            display: flex;
            background: linear-gradient(160deg, var(--ivory), var(--ivory-dim) 100%);
            border-radius: calc(var(--s) * 0.14);
            box-shadow:
                0 3px 0 rgba(0,0,0,0.25),
                0 6px 10px rgba(0,0,0,0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.9),
                inset 0 -2px 3px rgba(150, 130, 90, 0.25);
            padding: 0;
            gap: 0;
            border: 1px solid #cbb98e;
            align-items: stretch;
            justify-content: center;
            position: relative;
            animation: spawn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            flex-shrink: 0;
        }

        .domino.is-double::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(205, 164, 94, 0.55);
            border-radius: calc(var(--s) * 0.11);
            pointer-events: none;
        }

        @keyframes spawn {
            from { opacity: 0; transform: scale(0.6) translateY(-22px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .table-shake { animation: tableShake 0.15s ease-in-out; }
        @keyframes tableShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, 1px); }
        }

        .domino-clickable { cursor: pointer; transition: transform 0.15s cubic-bezier(0.175,0.885,0.32,1.1), box-shadow 0.15s ease, border-color 0.15s ease; }
        .domino-clickable:hover {
            transform: translateY(-7px) scale(1.06);
            box-shadow:
                0 14px 22px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.9),
                inset 0 -2px 3px rgba(150, 130, 90, 0.25);
            border-color: var(--brass);
        }
        .domino-clickable.invalid { opacity: 0.32; filter: grayscale(0.7) brightness(0.85); }
        .domino-clickable.invalid:hover {
            transform: none;
            box-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 6px 10px rgba(0,0,0,0.35);
            border-color: #cbb98e;
        }

        .domino-half {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
            flex: 1 1 50%;
            width: 50%;
            height: 100%;
            padding: calc(var(--s) * 0.13);
            box-sizing: border-box;
            align-items: center;
            justify-items: center;
        }

        .divider {
            width: 1.5px;
            background: linear-gradient(180deg, transparent, #a3906a, transparent);
            align-self: center;
            height: 76%;
            flex-shrink: 0;
            margin: 0;
        }

        .dot {
            width: calc(var(--s) * 0.13);
            height: calc(var(--s) * 0.13);
            background: radial-gradient(circle at 35% 30%, #4a3a25, var(--ink) 70%);
            border-radius: 50%;
            box-shadow: 0 0.5px 1px rgba(255,255,255,0.3) inset;
        }
        .dot-empty { opacity: 0; }

        /* ===== Free-side chooser ===== */
        .side-chooser {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, rgba(205, 164, 94, 0.16), rgba(0,0,0,0.25));
            border: 1px solid rgba(205, 164, 94, 0.45);
            border-radius: 12px;
            padding: 10px 14px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease, border-width 0.2s ease;
        }
        .side-chooser.active {
            max-height: 120px;
            opacity: 1;
            padding: 10px 14px;
            border-width: 1px;
        }
        .side-chooser-label {
            font-size: clamp(0.72rem, 1.7vw, 0.86rem);
            color: var(--cream);
            font-weight: 600;
            flex: 1 1 200px;
        }
        .side-chooser-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== Hand ===== */
        .hand-area {
            background: linear-gradient(180deg, rgba(0,0,0,0.32), rgba(0,0,0,0.18));
            border-radius: clamp(12px, 2.6vw, 20px);
            padding: clamp(10px, 2.2vw, 15px);
            border: 1px solid rgba(205, 164, 94, 0.25);
        }

        .hand-title {
            font-weight: 700;
            font-size: clamp(0.72rem, 1.7vw, 0.85rem);
            margin-bottom: 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--cream);
            letter-spacing: 0.3px;
        }
        .hand-title small {
            background: rgba(205, 164, 94, 0.18);
            border: 1px solid rgba(205, 164, 94, 0.3);
            padding: 2px 9px;
            border-radius: 10px;
            color: var(--brass-bright);
            font-weight: 700;
        }

        .hand-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(5px, 1.3vw, 9px);
            min-height: 56px;
            transition: opacity 0.2s ease;
        }
        .hand-container.awaiting-choice {
            opacity: 0.5;
            pointer-events: none;
        }

        /* ===== Endgame overlay ===== */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 35%, rgba(20, 30, 22, 0.97), rgba(3, 8, 5, 0.99));
            border-radius: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .overlay-icon {
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            margin-bottom: 6px;
            transform: scale(0.4);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s;
        }
        .overlay.active .overlay-icon { transform: scale(1); opacity: 1; }

        .overlay-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5.6vw, 3.4rem);
            margin-bottom: 10px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1px;
            transform: scale(0.4) translateY(30px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .overlay.active .overlay-title {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .overlay-title.win-color {
            background: linear-gradient(180deg, var(--brass-bright), var(--brass));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .overlay-title.lose-color { color: var(--danger); }
        .overlay-title.draw-color { color: var(--cream); }

        .overlay-msg {
            color: var(--cream-dim);
            font-size: clamp(0.9rem, 2.3vw, 1.1rem);
            margin-bottom: 26px;
            text-align: center;
            max-width: 85%;
            opacity: 0;
            transition: opacity 0.5s ease 0.35s;
        }
        .overlay.active .overlay-msg { opacity: 1; }

        .confetti-particle {
            position: absolute;
            width: clamp(5px, 1.3vw, 10px);
            height: clamp(10px, 2.6vw, 20px);
            pointer-events: none;
            z-index: 12;
            top: -30px;
            animation: fallAndSpin 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes fallAndSpin {
            0% { transform: translateY(0) rotateX(0) rotateY(0) rotateZ(0); opacity: 1; }
            100% { transform: translateY(105vh) rotateX(720deg) rotateY(360deg) rotateZ(180deg); opacity: 0.3; }
        }

        @media (max-width: 460px) {
            .actions-header { width: 100%; justify-content: flex-end; }
            .plaque-tiles { display: none; }
        }
        @media (max-width: 360px) {
            .plaque-name span.label { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .btn:focus-visible, .domino-clickable:focus-visible, .icon-btn:focus-visible {
            outline: 2px solid var(--brass-bright);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="game-container" id="mainGameWrapper">
    <div class="overlay" id="endgameOverlay">
        <div class="overlay-icon" id="overlayIcon">🏆</div>
        <div class="overlay-title win-color" id="overlayTitle">Vitória!</div>
        <div class="overlay-msg" id="overlayMsg">Você dominou a partida.</div>
        <button class="btn btn-brass" id="overlayRestartBtn">⟳ Jogar Novamente</button>
    </div>

    <div class="header">
        <div class="brand">
            <span class="crest">♠</span>
            <div class="title">Dominó <span style="opacity:.7">Clube Real</span><span class="sub">Mesa de Mogno &amp; Latão</span></div>
        </div>
        <div class="actions-header">
            <button class="btn icon-btn btn-ghost" id="muteBtn" title="Som" aria-label="Ativar ou desativar som">🔊</button>
            <button class="btn icon-btn btn-ghost" id="fullscreenBtn" title="Tela cheia" aria-label="Tela cheia">⛶</button>
            <button class="btn btn-pass" id="passBtn">Comprar Peça</button>
            <button class="btn btn-ghost" id="restartBtn">⟳ Reiniciar</button>
        </div>
    </div>

    <div class="scoreboard">
        <div class="player-plaque" id="cpuPlaque">
            <div class="avatar">🤖</div>
            <div class="plaque-info">
                <div class="plaque-name">Computador <small class="plaque-tiles" id="cpuHandCount">7 peças</small></div>
            </div>
            <div class="plaque-score"><span id="cpuScore">0</span><small>Vitórias</small></div>
        </div>
        <div class="player-plaque" id="playerPlaque">
            <div class="avatar">🧑</div>
            <div class="plaque-info">
                <div class="plaque-name">Você <small class="plaque-tiles" id="playerHandCountLabel">7 peças</small></div>
            </div>
            <div class="plaque-score"><span id="playerScore">0</span><small>Vitórias</small></div>
        </div>
    </div>

    <div class="table" id="tableZone">
        <div class="table-message" id="gameStatus">Sua vez — escolha uma peça</div>
        <div class="domino-row" id="tableRow"></div>
        <div class="pool-counter" id="poolCounter">Monte: 14</div>
    </div>

    <div class="side-chooser" id="sideChooser">
        <span class="side-chooser-label">Essa peça encaixa nos dois lados — onde jogar?</span>
        <div class="side-chooser-actions">
            <button class="btn btn-brass" id="chooseLeftBtn">◀ Esquerda</button>
            <button class="btn btn-brass" id="chooseRightBtn">Direita ▶</button>
            <button class="btn btn-ghost" id="chooseCancelBtn">Cancelar</button>
        </div>
    </div>

    <div class="hand-area">
        <div class="hand-title">
            <span>Suas peças</span>
            <small id="handCount">0</small>
        </div>
        <div class="hand-container" id="playerHand"></div>
    </div>
</div>

<script>
    (function() {
        let audioCtx = null;
        let muted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (muted) return;
            initAudio();
            if (!audioCtx) return;

            const t = audioCtx.currentTime;

            if (type === 'play') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.09);
            }
            else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, t);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.04);
            }
            else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(95, t);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.14);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.15);
            }
            else if (type === 'win') {
                [293.66, 349.23, 440, 523.25].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, t + (idx * 0.08));
                    gain.gain.setValueAtTime(0.18, t + (idx * 0.08));
                    gain.gain.linearRampToValueAtTime(0.001, t + (idx * 0.08) + 0.18);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t + (idx * 0.08)); osc.stop(t + (idx * 0.08) + 0.22);
                });
            }
            else if (type === 'lose') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.linearRampToValueAtTime(70, t + 0.45);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.45);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.5);
            }
        }

        const dotPositions = {
            0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8],
            4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
        };

        let game = {
            playerHand: [],
            cpuHand: [],
            table: [],
            pool: [],
            leftEnd: null,
            rightEnd: null,
            playerScore: 0,
            cpuScore: 0,
            turn: 'player',
            passCount: 0
        };

        // Tracks the pending CPU-turn timer so a mid-turn restart can't leave
        // a stale callback that mutates a freshly reset game state.
        let cpuTurnTimeoutId = null;

        function clearPendingCpuTurn() {
            if (cpuTurnTimeoutId !== null) {
                clearTimeout(cpuTurnTimeoutId);
                cpuTurnTimeoutId = null;
            }
        }

        function scheduleCpuTurn(delay) {
            clearPendingCpuTurn();
            cpuTurnTimeoutId = setTimeout(() => {
                cpuTurnTimeoutId = null;
                cpuTurn();
            }, delay);
        }

        const tableZone = document.getElementById('tableZone');
        const tableRow = document.getElementById('tableRow');
        const playerHandDiv = document.getElementById('playerHand');
        const gameStatus = document.getElementById('gameStatus');
        const cpuScoreSpan = document.getElementById('cpuScore');
        const playerScoreSpan = document.getElementById('playerScore');
        const handCountSpan = document.getElementById('handCount');
        const cpuHandCountSpan = document.getElementById('cpuHandCount');
        const playerHandCountLabel = document.getElementById('playerHandCountLabel');
        const passBtn = document.getElementById('passBtn');
        const poolCounter = document.getElementById('poolCounter');
        const endgameOverlay = document.getElementById('endgameOverlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const muteBtn = document.getElementById('muteBtn');
        const mainGameWrapper = document.getElementById('mainGameWrapper');
        const cpuPlaque = document.getElementById('cpuPlaque');
        const playerPlaque = document.getElementById('playerPlaque');
        const sideChooser = document.getElementById('sideChooser');
        const chooseLeftBtn = document.getElementById('chooseLeftBtn');
        const chooseRightBtn = document.getElementById('chooseRightBtn');
        const chooseCancelBtn = document.getElementById('chooseCancelBtn');

        function updateFullscreenButtonState() {
            const isFull = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            fullscreenBtn.textContent = isFull ? "⤢" : "⛶";
            fullscreenBtn.title = isFull ? "Sair da tela cheia" : "Tela cheia";
        }

        document.addEventListener('fullscreenchange', updateFullscreenButtonState);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButtonState);

        fullscreenBtn.addEventListener('click', () => {
            playSound('click');
            const doc = window.document;
            const docEl = mainGameWrapper;

            const requestFullScreen = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
            const isCurrentlyFull = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!isCurrentlyFull) {
                if (requestFullScreen) requestFullScreen.call(docEl).catch(() => {});
            } else {
                if (cancelFullScreen) cancelFullScreen.call(doc);
            }
        });

        muteBtn.addEventListener('click', () => {
            muted = !muted;
            muteBtn.textContent = muted ? '🔇' : '🔊';
            muteBtn.title = muted ? 'Ativar som' : 'Desativar som';
            if (!muted) playSound('click');
        });

        function createDominoSet() {
            const set = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) set.push([i, j]);
            }
            return set;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createDotsHTML(n) {
            const container = document.createElement('div');
            container.className = 'domino-half';
            const activeDots = dotPositions[n];
            for (let i = 0; i < 9; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (activeDots.includes(i) ? '' : ' dot-empty');
                container.appendChild(dot);
            }
            return container;
        }

        function createDominoElement(a, b, clickable = false, valid = true, onClick = null) {
            const div = document.createElement('div');
            div.className = 'domino' + (a === b ? ' is-double' : '') + (clickable ? ' domino-clickable' : '') + (!valid && clickable ? ' invalid' : '');

            if (clickable) {
                div.tabIndex = 0;
                div.setAttribute('role', 'button');
                div.setAttribute('aria-label', `Peça ${a}-${b}${valid ? '' : ' (não pode ser jogada)'}`);
                const activate = () => {
                    if (!valid) playSound('error');
                    else if (onClick) onClick();
                };
                div.addEventListener('click', activate);
                div.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
                });
            }

            div.appendChild(createDotsHTML(a));
            const divider = document.createElement('div');
            divider.className = 'divider';
            div.appendChild(divider);
            div.appendChild(createDotsHTML(b));
            return div;
        }

        function hasValidMoves(hand) {
            if (game.table.length === 0) return true;
            return hand.some(p => p[0] === game.leftEnd || p[1] === game.leftEnd || p[0] === game.rightEnd || p[1] === game.rightEnd);
        }

        function renderTable() {
            tableRow.innerHTML = '';
            if (game.table.length === 0) {
                tableRow.classList.add('is-empty');
                const hint = document.createElement('div');
                hint.className = 'empty-table-hint';
                hint.textContent = 'A mesa está vazia — abra o jogo.';
                tableRow.appendChild(hint);
            } else {
                tableRow.classList.remove('is-empty');
                game.table.forEach(piece => {
                    tableRow.appendChild(createDominoElement(piece[0], piece[1], false));
                });
            }

            poolCounter.textContent = `Monte: ${game.pool.length}`;

            requestAnimationFrame(() => {
                tableRow.scrollLeft = tableRow.scrollWidth;
                tableRow.scrollTop = tableRow.scrollHeight;
            });
        }

        function renderPlayerHand() {
            playerHandDiv.innerHTML = '';
            handCountSpan.textContent = game.playerHand.length;
            cpuHandCountSpan.textContent = `${game.cpuHand.length} peças`;
            playerHandCountLabel.textContent = `${game.playerHand.length} peças`;

            const sortedHand = [...game.playerHand].sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]));

            sortedHand.forEach(piece => {
                const valid = game.table.length === 0 || piece[0] === game.leftEnd || piece[1] === game.leftEnd || piece[0] === game.rightEnd || piece[1] === game.rightEnd;
                const el = createDominoElement(piece[0], piece[1], true, valid, () => handlePlayerPlay(piece));
                playerHandDiv.appendChild(el);
            });

            passBtn.textContent = game.pool.length > 0 ? 'Comprar Peça' : 'Passar Vez';

            if (game.turn === 'player' && !hasValidMoves(game.playerHand)) {
                passBtn.classList.add('active');
            } else {
                passBtn.classList.remove('active');
            }
        }

        function updateTurnHighlight() {
            cpuPlaque.classList.toggle('turn-active', game.turn === 'cpu');
            playerPlaque.classList.toggle('turn-active', game.turn === 'player');
        }

        function updateUI() {
            cpuScoreSpan.textContent = game.cpuScore;
            playerScoreSpan.textContent = game.playerScore;
            cpuHandCountSpan.textContent = `${game.cpuHand.length} peças`;
            updateTurnHighlight();
            if (game.turn === 'player') {
                gameStatus.textContent = '🧑 Sua vez — escolha uma peça';
            } else {
                gameStatus.textContent = '🤖 Computador jogando...';
            }
        }

        function playPieceLogic(piece, side, isPlayer) {
            playSound('play');

            tableZone.classList.remove('table-shake');
            void tableZone.offsetWidth;
            tableZone.classList.add('table-shake');

            const hand = isPlayer ? game.playerHand : game.cpuHand;
            const idx = hand.findIndex(p => p[0] === piece[0] && p[1] === piece[1]);
            if (idx !== -1) hand.splice(idx, 1);

            if (game.table.length === 0) {
                game.table.push(piece);
                game.leftEnd = piece[0];
                game.rightEnd = piece[1];
            } else if (side === 'left') {
                if (piece[1] === game.leftEnd) {
                    game.table.unshift(piece);
                    game.leftEnd = piece[0];
                } else {
                    game.table.unshift([piece[1], piece[0]]);
                    game.leftEnd = piece[1];
                }
            } else {
                if (piece[0] === game.rightEnd) {
                    game.table.push(piece);
                    game.rightEnd = piece[1];
                } else {
                    game.table.push([piece[1], piece[0]]);
                    game.rightEnd = piece[0];
                }
            }
            game.passCount = 0;
        }

        // When the tapped piece fits both ends, the player is asked which
        // side to attach it to instead of the game deciding automatically.
        let pendingChoicePiece = null;

        function showSideChooser(piece) {
            pendingChoicePiece = piece;
            sideChooser.classList.add('active');
            playerHandDiv.classList.add('awaiting-choice');
            gameStatus.textContent = '🧑 Escolha em qual lado jogar a peça';
        }

        function hideSideChooser() {
            pendingChoicePiece = null;
            sideChooser.classList.remove('active');
            playerHandDiv.classList.remove('awaiting-choice');
        }

        chooseLeftBtn.addEventListener('click', () => {
            if (!pendingChoicePiece) return;
            const piece = pendingChoicePiece;
            hideSideChooser();
            playPieceLogic(piece, 'left', true);
            afterPlayerMove();
        });

        chooseRightBtn.addEventListener('click', () => {
            if (!pendingChoicePiece) return;
            const piece = pendingChoicePiece;
            hideSideChooser();
            playPieceLogic(piece, 'right', true);
            afterPlayerMove();
        });

        chooseCancelBtn.addEventListener('click', () => {
            playSound('click');
            hideSideChooser();
            updateUI();
        });

        function afterPlayerMove() {
            renderTable();
            if (checkEndConditions()) return;

            game.turn = 'cpu';
            renderPlayerHand();
            updateUI();
            scheduleCpuTurn(900);
        }

        function handlePlayerPlay(piece) {
            if (game.turn !== 'player' || pendingChoicePiece) return;

            if (game.table.length === 0) {
                playPieceLogic(piece, 'right', true);
            } else {
                const canLeft = piece[0] === game.leftEnd || piece[1] === game.leftEnd;
                const canRight = piece[0] === game.rightEnd || piece[1] === game.rightEnd;

                if (canLeft && canRight) {
                    showSideChooser(piece);
                    return;
                } else if (canLeft) {
                    playPieceLogic(piece, 'left', true);
                } else if (canRight) {
                    playPieceLogic(piece, 'right', true);
                } else {
                    return;
                }
            }

            afterPlayerMove();
        }

        function cpuTurn() {
            if (game.turn !== 'cpu') return;

            while (!hasValidMoves(game.cpuHand) && game.pool.length > 0) {
                const piece = game.pool.pop();
                game.cpuHand.push(piece);
            }

            const playablePieces = game.cpuHand.filter(piece =>
                game.table.length === 0 || piece[0] === game.leftEnd || piece[1] === game.leftEnd || piece[0] === game.rightEnd || piece[1] === game.rightEnd
            );

            if (playablePieces.length > 0) {
                playablePieces.sort((a, b) => (b[0] + b[1]) - (a[0] + a[1]));
                const chosenPiece = playablePieces[0];

                if (game.table.length === 0) {
                    playPieceLogic(chosenPiece, 'right', false);
                } else if (chosenPiece[0] === game.leftEnd || chosenPiece[1] === game.leftEnd) {
                    playPieceLogic(chosenPiece, 'left', false);
                } else {
                    playPieceLogic(chosenPiece, 'right', false);
                }
            } else {
                game.passCount++;
                playSound('error');
                gameStatus.textContent = '🤖 O computador não tem peças e passou a vez!';
            }

            renderTable();
            if (checkEndConditions()) return;

            game.turn = 'player';
            renderPlayerHand();
            updateUI();
        }

        function triggerConfetti(isVictory) {
            document.querySelectorAll('.confetti-particle').forEach(p => p.remove());

            const particleCount = isVictory ? 75 : 20;
            const container = mainGameWrapper;

            const victoryColors = ['#cda45e', '#f6efdc', '#2e8b57', '#ffffff', '#e8c877'];
            const defeatColors = ['#7f8c8d', '#95a5a6', '#34495e'];
            const colors = isVictory ? victoryColors : defeatColors;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-particle';
                p.style.left = Math.random() * 100 + '%';

                const widthScale = Math.random() * 0.6 + 0.5;
                p.style.transform = `scale(${widthScale})`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                if (isVictory) {
                    p.style.boxShadow = '0 2px 5px rgba(205, 164, 94, 0.4)';
                }

                p.style.animationDelay = Math.random() * 1.5 + 's';
                p.style.animationDuration = (Math.random() * 1.5 + 2) + 's';

                container.appendChild(p);
                setTimeout(() => p.remove(), 4000);
            }
        }

        function endMatch(winner, reason) {
            overlayTitle.classList.remove('win-color', 'lose-color', 'draw-color');

            if (winner === 'player') {
                game.playerScore++;
                playSound('win');
                overlayIcon.textContent = '🏆';
                overlayTitle.textContent = 'Vitória!';
                overlayTitle.classList.add('win-color');
                triggerConfetti(true);
            } else if (winner === 'cpu') {
                game.cpuScore++;
                playSound('lose');
                overlayIcon.textContent = '💻';
                overlayTitle.textContent = 'Derrota...';
                overlayTitle.classList.add('lose-color');
                triggerConfetti(false);
            } else {
                playSound('click');
                overlayIcon.textContent = '🤝';
                overlayTitle.textContent = 'Empate!';
                overlayTitle.classList.add('draw-color');
            }

            cpuScoreSpan.textContent = game.cpuScore;
            playerScoreSpan.textContent = game.playerScore;
            overlayMsg.textContent = reason;
            setTimeout(() => endgameOverlay.classList.add('active'), 500);
        }

        function checkEndConditions() {
            if (game.playerHand.length === 0) {
                endMatch('player', 'Você bateu todas as peças primeiro!');
                return true;
            }
            if (game.cpuHand.length === 0) {
                endMatch('cpu', 'O computador bateu todas as peças.');
                return true;
            }

            if (game.passCount >= 2 && game.pool.length === 0) {
                const playerPoints = game.playerHand.reduce((acc, p) => acc + p[0] + p[1], 0);
                const cpuPoints = game.cpuHand.reduce((acc, p) => acc + p[0] + p[1], 0);
                let msg = `Jogo fechado! Contagem: Você (${playerPoints} pts) vs CPU (${cpuPoints} pts).`;

                if (playerPoints < cpuPoints) endMatch('player', msg + ' Você ganhou por menor pontuação!');
                else if (cpuPoints < playerPoints) endMatch('cpu', msg + ' CPU venceu por menor pontuação.');
                else endMatch('draw', msg + ' Pontuações idênticas!');
                return true;
            }
            return false;
        }

        function initGame() {
            clearPendingCpuTurn();
            hideSideChooser();
            initAudio();
            document.querySelectorAll('.confetti-particle').forEach(p => p.remove());
            endgameOverlay.classList.remove('active');

            const pool = createDominoSet();
            shuffle(pool);

            game.playerHand = pool.slice(0, 7);
            game.cpuHand = pool.slice(7, 14);
            game.pool = pool.slice(14, 28);

            game.table = [];
            game.leftEnd = null;
            game.rightEnd = null;
            game.passCount = 0;
            game.turn = 'player';

            renderTable();
            renderPlayerHand();
            updateUI();
        }

        passBtn.addEventListener('click', () => {
            if (!passBtn.classList.contains('active') || pendingChoicePiece) return;

            if (game.pool.length > 0) {
                playSound('click');
                const drawnPiece = game.pool.pop();
                game.playerHand.push(drawnPiece);

                renderTable();
                renderPlayerHand();

                if (hasValidMoves(game.playerHand)) {
                    gameStatus.textContent = '🧑 Você comprou uma peça jogável! Faça seu movimento.';
                } else {
                    gameStatus.textContent = '⚠️ Peça comprada não serve. Compre novamente.';
                }
            } else {
                game.passCount++;
                playSound('click');
                game.turn = 'cpu';
                renderPlayerHand();
                updateUI();
                scheduleCpuTurn(800);
            }
        });

        document.getElementById('restartBtn').addEventListener('click', initGame);
        document.getElementById('overlayRestartBtn').addEventListener('click', initGame);

        initGame();
    })();
</script>
</body>
</html>
